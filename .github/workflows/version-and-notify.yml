name: Auto Version and Notify

on:
  push:
    branches:
      - main
      
permissions:
  contents: write
  pull-requests: write
  
jobs:
  create-version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get latest tag
        id: get_tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "📌 Current latest tag: $LATEST_TAG"
      
      - name: Bump version
        id: bump
        run: |
          LATEST_TAG="${{ steps.get_tag.outputs.latest_tag }}"
          VERSION=${LATEST_TAG#v}
          
          IFS='.' read -ra V <<< "$VERSION"
          MAJOR=${V[0]:-0}
          MINOR=${V[1]:-0}
          PATCH=${V[2]:-0}
          
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "🆕 New version: v$NEW_VERSION"
      
      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.bump.outputs.new_version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Tag already exists, skipping"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Create tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git tag -a "v${{ steps.bump.outputs.new_version }}" -m "Auto-release v${{ steps.bump.outputs.new_version }}"
          git push origin "v${{ steps.bump.outputs.new_version }}"
          
          echo "✅ Created and pushed tag v${{ steps.bump.outputs.new_version }}"
      
      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.bump.outputs.new_version }}
          name: Release v${{ steps.bump.outputs.new_version }}
          body: |
            ## Release v${{ steps.bump.outputs.new_version }}
            
            **Commit:** ${{ github.sha }}
            **Author:** ${{ github.actor }}
            **Date:** ${{ github.event.head_commit.timestamp }}
            
            ### Changes
            ${{ github.event.head_commit.message }}
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Notify platform-releases
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          echo "📢 Notifying platform-releases of v${{ steps.bump.outputs.new_version }}"
          
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            https://api.github.com/repos/Mamdooh/pipeline-releases/dispatches \
            -d "{
              \"event_type\": \"service-update\",
              \"client_payload\": {
                \"service\": \"pipeline_dev_predictor\",
                \"version\": \"v${{ steps.bump.outputs.new_version }}\",
                \"repo\": \"Mamdooh/pipeline_dev_predictor\"
              }
            }"
          
          echo "✅ Platform notified successfully"

version: "1.0"
linter: jetbrains/qodana-python:2025.2

profile:
  name: qodana.recommended

include:
  # Python security
  - name: PySecurity
  - name: PyUnsafeEval
  - name: PySubprocess
  - name: PyHardcodedPasswords
  - name: PyPathTraversal

  # Code quality / bug risks (visible, easy wins)
  - name: PyUnusedLocal
  - name: PyBroadException
  - name: PyShadowingBuiltins

  # Dependency/license hygiene (keep, but secondary)
  - name: CheckDependencyLicenses

exclude:
  - name: PyUnresolvedReferences
  - name: PyUnresolvedReferencesInspection

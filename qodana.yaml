version: "1.0"
profile:
  name: qodana.recommended
failThreshold: 0

exclude:
  - name: Tests
    paths:
      - "tests/**"
      - "**/*test*.py"
  - name: Migrations
    paths:
      - "**/migrations/**"
  - name: VirtualEnv
    paths:
      - "venv/**"
      - ".venv/**"
      - "node_modules/**"

inspections:
  - group: Security
    enabled: true
    severity: ERROR
  
  - inspection: SqlInjection
    enabled: true
    severity: ERROR
  
  - inspection: XssVulnerability
    enabled: true
    severity: ERROR
  
  - inspection: CommandInjection
    enabled: true
    severity: ERROR
  
  - inspection: PathTraversal
    enabled: true
    severity: ERROR
  
  - inspection: HardcodedPassword
    enabled: true
    severity: ERROR
  
  - inspection: HardcodedApiKey
    enabled: true
    severity: ERROR
  
  - inspection: UnsafeDeserialization
    enabled: true
    severity: ERROR
  
  - inspection: UnsafeEval
    enabled: true
    severity: ERROR
  
  - inspection: UnsafeExec
    enabled: true
    severity: ERROR
  
  - inspection: WeakCryptography
    enabled: true
    severity: WARNING
  
  - inspection: InsecureRandomness
    enabled: true
    severity: WARNING

dependencyOverrides:
  - name: python
    enabled: true

output:
  sarif: true

version: "1.0"
linter: jetbrains/qodana-python:2025.2

profile:
  name: qodana.recommended

python:
  dependencies:
    - requirements.qodana.txt
  django:
    enabled: true

include:
  # Python security
  - name: PySecurity
  - name: PyUnsafeEval
  - name: PySubprocess
  - name: PyHardcodedPasswords
  - name: PyPathTraversal

  # Code quality / bug risks (visible, easy wins)
  - name: PyUnusedLocal
  - name: PyBroadException
  - name: PyShadowingBuiltins

  # Dependency/license hygiene (secondary)
  - name: CheckDependencyLicenses

trigger:
  branches:
    include:
      - master

pool:
  vmImage: ubuntu-latest

steps:
- task: Docker@2
  displayName: Build and Push Predictor
  inputs:
    containerRegistry: 'Pipeline-Dev_RegConn'
    repository: 'pipeline_dev_predictor'
    command: 'buildAndPush'
    Dockerfile: '**/Dockerfile'
    tags: 'latest'